# Reverse proxy for orderscan-ocr. Only loaded when the "proxy" compose
# profile is active (docker-compose.prod.yml). Regenerated/extended by
# ops/ssl-renew.sh once a domain + certificate exist.

server {
    listen 80;
    server_name _;

    # Required for certbot's HTTP-01 challenge (ops/ssl-renew.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://ocr:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
        proxy_read_timeout 120s;
    }
}

