[pytest]
testpaths = tests
# This suite has no async test functions/fixtures today (see test_main.py's
# module docstring for why: TestClient runs async routes fine without any),
# but pytest-asyncio's plugin still activates because it's installed and
# warns if this isn't set explicitly. "function" is its own default.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Starlette's own testclient.py emits this on every import — it's their
    # internal migration to anyio's non-deprecated alias, not anything in
    # this project's code, and there is no version pin here that fixes it.
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
