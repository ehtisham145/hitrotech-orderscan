# Root-level config so `pytest` works from the repo root, not only from inside
# ocr-service/. Without it, collection finds ocr-service/tests but fails on
# `from app import preprocess`, because `app` is only importable with
# ocr-service/ on the path — which looks like a broken test suite rather than a
# wrong working directory.
#
# ocr-service/pytest.ini stays as it is: running `pytest` from inside that
# directory uses that file instead, and both paths now behave the same.
#
# The Python suite needs its own dependencies — they are NOT part of npm
# install:
#   pip install -r ocr-service/requirements/test.txt
[pytest]
testpaths = ocr-service/tests
pythonpath = ocr-service
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Starlette's own testclient.py emits this on every import — their internal
    # migration to anyio's non-deprecated alias, not anything in this project.
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
