# Reverse proxy for the main app. Only loaded when the "proxy" compose
# profile is active (docker-compose.prod.yml). Regenerated/extended by
# ops/ssl-renew.sh once a domain + certificate exist.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }
}

# ops/ssl-renew.sh appends the HTTPS server block below the first time it
# successfully issues a certificate for DOMAIN (same template as
# ocr-service/ops/nginx.conf).
