services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: orderscan-app:${IMAGE_TAG:-latest}
    container_name: orderscan-app
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:8080"
    networks:
      - default
      - orderscan-net
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # Reverse proxy + TLS termination for the web app. Only starts with
  # `--profile proxy` (see ops/deploy.sh --with-proxy).
  nginx:
    image: nginx:alpine
    container_name: orderscan-app-nginx
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: orderscan-app-certbot
    profiles: ["proxy"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-etc:
  certbot-www:

networks:
  # Shared with ocr-service/docker-compose.prod.yml so this app can reach it
  # as http://ocr:8080 internally. Created by either side's ops/deploy.sh.
  orderscan-net:
    external: true
