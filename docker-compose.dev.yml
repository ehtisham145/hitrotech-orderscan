services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: orderscan-app:dev
    container_name: orderscan-app-dev
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./vite.config.ts:/app/vite.config.ts
    restart: unless-stopped
